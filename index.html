 .pcard .pb{padding:10px;gap:6px}
 .pcard .pa .btn{height:34px;font-size:12px;padding:0 4px}
 .pcard .pa .btn svg{display:none}
 /* orders list as cards */
 .otable thead{display:none}
 .otable,.otable tbody{display:block}
 .otable tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 6px;border-bottom:1px solid #EEF0F4}
 .otable td{border:0;padding:0;min-width:0!important}
 .otable td:nth-child(1){flex:1 1 auto}
 .otable td:nth-child(6){margin-left:auto}
 .otable td:nth-child(2){order:3;flex:1 1 60%;font-size:13px}
 .otable td:nth-child(3){order:4;font-size:13px}
 .otable td:nth-child(4){order:5;flex:1 1 100%}
 .otable td:nth-child(5){order:6;font-size:12px;color:#5E6472}
 .otable td:nth-child(5)::before{content:'Due '}
 /* modals as full-height sheets */
 .modal-bg{padding:0;align-items:flex-end}
 .modal{max-width:none;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
 .modal [style*="max-height:56vh"]{max-height:none!important;overflow:visible!important;border:0!important}
 .modal [style*="grid-template-columns:repeat(2"]{grid-template-columns:1fr!important}
 .modal [style*="justify-content:flex-end"]{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 4px;margin-bottom:-4px}
 /* production entry rows as cards */
 .ptable thead{display:none}
 .ptable,.ptable tbody{display:block}
 .ptable tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 0;border-bottom:1px solid #EEF0F4}
 .ptable td{border:0;padding:0;text-align:left!important;font-size:13px}
 .ptable td:empty{display:none}
 .ptable td:nth-child(1){grid-column:1/-1}
 .ptable td:nth-child(1) div[style*="max-width:260px"]{max-width:none!important;white-space:normal!important}
 .ptable td:nth-child(2)::before{content:'Ordered ';color:#5E6472}
 .ptable td:nth-child(3)::before{content:'Shipped before ';color:#5E6472}
 .ptable td:nth-child(4)::before{content:'This batch (pcs)';display:block;color:#5E6472;font-size:12px;margin-bottom:4px}
 .ptable td:nth-child(5)::before{content:'Grams';display:block;color:#5E6472;font-size:12px;margin-bottom:4px}
 .ptable td:nth-child(6)::before{content:'Stone ct';display:block;color:#5E6472;font-size:12px;margin-bottom:4px}
 .ptable .inp.sm{width:100%;text-align:left;height:42px}
 .lb img{max-width:100vw}
}
@media (display-mode:standalone){.top{padding-top:env(safe-area-inset-top)}}

<script>
var APPV='2026-11-28-54';
function checkVer(){try{fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/var APPV='([^']+)'/);if(!m||m[1]===APPV||sessionStorage.getItem('appv_try')===m[1])return;if(document.querySelector('.modal')){window._verWait=m[1];return;}sessionStorage.setItem('appv_try',m[1]);location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash);}).catch(function(){});}catch(e){}}
checkVer();setInterval(checkVer,120000);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkVer();});window.addEventListener('focus',checkVer);
var D=null, S={busy:{},page:'home', ordTab:'open', sel:null, prodTab:'all', prodQ:'', catTab:'all', q:'', open:{}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function go(p){S.page=p;S.q='';draw();window.scrollTo(0,0);}
function nav(){var n='<div class="brand">Muscat <span>Hub</span></div>';NAV.forEach(function(x){n+='<button class="nl'+(S.page===x[0]?' on':'')+'" onclick="go(\''+x[0]+'\')">'+ic(x[2])+'<span class="nt">'+x[1]+'</span>'+(x[0]==='basket'&&D&&D.basket.length?'<span class="badge">'+D.basket.length+'</span>':'')+'</button>';});
 if(D&&D.team)n+='<button class="nl hide-m'+(S.page==='access'?' on':'')+'" onclick="go(\'access\')">'+ic('users')+'<span class="nt">Access log</span></button>';
 if(D&&D.user)n+='<div class="who">'+esc(D.user)+(D.role==='view'?' · <b>View only</b>':'')+'</div>';if(D)n+='<div class="price"><div>Live gold 24K <b>'+money(D.prices.gold,2)+'/g</b></div><div>Live silver 999 <b>'+money(D.prices.silver,3)+'/g</b></div><div>Updated '+esc(D.at.slice(11))+'</div><div style="opacity:.6">Version '+APPV+'</div></div>';document.getElementById('nav').innerHTML=n;}
function match(t){var q=S.q.trim().toLowerCase();return !q||String(t).toLowerCase().indexOf(q)>=0;}
function openOrders(){return D.orders.filter(function(o){return !o.closed;});}

/* ---------- HOME ---------- */
function ago(iso){var d=(Date.now()-new Date(iso).getTime())/60000;if(d<1)return 'just now';if(d<60)return Math.round(d)+' min ago';if(d<1440)return Math.round(d/60)+' h ago';if(d<2880)return 'yesterday';return Math.round(d/1440)+' days ago';}
function home(){var oo=openOrders(), inprod=oo.filter(function(o){return /production/i.test(o.status);}).length;
 var month=D.at.slice(0,7), sm=D.ships.filter(function(s){return s.shipped&&String(s.date).slice(0,7)===month;});
 var pcsM=sm.reduce(function(a,s){return a+s.pcs;},0);
 var openLines=D.lines.filter(function(l){var o=D.orders.find(function(x){return x.no===l.order;});return o&&!o.closed&&l.shipped<l.ordered;});
 var counts=[0,0,0,0,0,0,0];openLines.forEach(function(l){counts[stageOf(l)]+=Math.max(0,l.ordered-l.shipped);});var mx=Math.max.apply(null,counts.slice(1).concat([1]));
 var hr=new Date().getHours(), hi=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 var h='<div class="hide-m">'+topBar('Muscat Hub','Live data · '+esc(dt(D.at.slice(0,10)))+' · '+oo.length+' open orders','<button class="btn ghost" onclick="openQuick()">'+ic('bolt')+'Quick order</button><button class="btn gold" onclick="go(\'basket\')">'+ic('plus')+'New order</button>',true)+'</div>';
 /* phone hero: greeting, live prices, quick order */
 h+='<section class="hero only-m"><div class="hero-top"><div><div class="hero-hi">'+hi+(D.user?', '+esc(D.user):'')+(D.role==='view'?' <span class="rochip">View only</span>':'')+'</div><div class="hero-t">Muscat <span>Hub</span></div></div><button class="hero-ref" onclick="load()" aria-label="Refresh data">'+ic('refresh',18)+'</button></div>'
  +'<div class="hero-px"><div class="px"><div class="px-k"><i class="dot g"></i>Gold 24K</div><div class="px-v">'+money(D.prices.gold,2)+'<small>/g</small></div></div>'
  +'<div class="px"><div class="px-k"><i class="dot s"></i>Silver 999</div><div class="px-v">'+money(D.prices.silver,3)+'<small>/g</small></div></div></div>'
  +'<div class="hero-up">Live · updated '+esc(D.at.slice(11))+'</div>'
  +'<button class="hero-qo" onclick="openQuick()">'+ic('bolt',20)+'<span>Quick order</span>'+ic('arrow',18)+'</button></section>';
 h+='<div class="grid4 kpis">'+[['Open orders',oo.length,inprod+' in production','list',"go('orders')"],['Shipped this month',money(sm.reduce(function(a,s){return a+(Number(s.value)||0);},0)),num(pcsM)+' pcs · '+sm.length+' shipment'+(sm.length===1?'':'s'),'plane',"go('ship')"],['Cash on hand',money(D.finance.cash),'after all app moves','cash',"go('finance')"],['Owed to suppliers',money(D.finance.owed),D.finance.balances.length+' suppliers open','tool',"go('finance')"]].map(function(k){return '<button class="card kpi" onclick="'+k[4]+'"><div class="kpi-i">'+ic(k[3],16)+'</div><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="muted" style="margin-top:6px">'+k[2]+'</div></button>';}).join('')+'</div>';
 h+='<div class="flex" style="margin-top:16px"><div style="flex:2 1 520px;display:flex;flex-direction:column;gap:16px;min-width:0">';
 var due=oo.filter(function(o){return o.due;}).sort(function(a,b){return a.due.localeCompare(b.due);}).slice(0,5);
 h+='<section class="card"><div style="display:flex;align-items:center"><h2 class="h2">Due soon</h2><a href="#" onclick="go(\'orders\');return false" style="margin-left:auto;font-size:13px">All orders</a></div>'+due.map(function(o){return '<div class="row" style="cursor:pointer" onclick="S.sel=\''+o.no+'\';go(\'orders\')"><div class="thumb'+(o.metal==='Silver'?' sv':'')+'">'+esc(ini(o.cust))+'</div><div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(o.no)+' · '+esc(o.cust)+'</div><div class="muted">'+num(o.shipped)+' / '+num(o.qty)+' pcs shipped · '+esc(o.metal)+(o.usta?' · '+esc(o.usta):'')+'</div></div><span class="chip c-prod">Due '+dt(o.due)+'</span></div>';}).join('')+'</section></div>';
 h+='<section class="card" style="flex:1 1 320px"><h2 class="h2">Recent activity</h2>'+D.finance.moves.slice(0,7).map(moveRow).join('')+(D.finance.moves.length>7?'<button class="btn ghost sm" style="margin-top:10px" onclick="S.allMoves=true;go(\'finance\')">See all activity</button>':'')+'</section></div>';
 return h;}

/* ===== Quick order: one product straight into a customer order (CO) ===== */
var QO={};
function openQuick(){QO={mode:''};var h=mhead('Quick order','One product, straight into a new customer order (CO)');
 h+='<div class="qo-step">Step 1 of 2 · Does the product have a SKU?</div><div class="qo-pick">'
  +'<button class="qo-opt" onclick="qoMode(\'sku\')">'+ic('gem',22)+'<b>SKU</b><span>Pick a product from the catalog</span></button>'

 modal(h);}
function qoUstas(m){return (D.ustas||[]).filter(function(u){return /production/i.test(u.type)&&(!m||new RegExp(m,'i').test(u.type));});}
function qoMode(mode){QO.mode=mode;var sku=mode==='sku';var d=new Date();d.setDate(d.getDate()+14);
 var h=mhead('Quick order · '+(sku?'SKU':'No SKU'),'Fields marked * are required');
 h+='<div class="qo-step"><a href="#" onclick="openQuick();return false">← Change</a> · Step 2 of 2</div>';
 h+='<div class="qo-form">'
  +'<div class="fld" style="grid-column:1/-1">Metal *<div class="seg qo-seg"><label><input type="radio" name="qo_m" value="Gold" onchange="qoMetal()">Gold</label><label><input type="radio" name="qo_m" value="Silver" onchange="qoMetal()">Silver</label></div></div>'

       :'<label class="fld" style="grid-column:1/-1">Product description *<input class="inp" id="qo_title" autocomplete="off" placeholder="e.g. 14k name necklace, 45 cm"></label><label class="fld">Estimated gram / pc<input class="inp" type="number" min="0" step="0.01" id="qo_gram"></label>')
  +'<label class="fld">Qty<input class="inp" type="number" min="1" id="qo_q" value="1"></label>'
  +'<label class="fld">Color<input class="inp" id="qo_c" placeholder="yellow / white / rose"></label>'
  +'<label class="fld">Size<input class="inp" id="qo_s"></label>'

  +'<div class="fld" style="grid-column:1/-1">Photo *<label class="qo-photo" id="qo_pbox"><input type="file" accept="image/*" id="qo_p" onchange="qoPrev(this)"><span id="qo_ptxt">'+ic('camera',22)+'Tap to take or choose a photo</span></label></div>'
  +'<label class="fld" style="grid-column:1/-1">Product special note <span class="muted">(optional)</span><textarea class="inp qo-ta" id="qo_note" placeholder="Engraving, stones, length…"></textarea></label>'
  +'<label class="fld" style="grid-column:1/-1">Order note <span class="muted">(optional)</span><textarea class="inp qo-ta" id="qo_onote"></textarea></label>'
  +'</div>';
 h+='<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="qo_save" onclick="saveQuick()">Create order</button></div>';
 modal(h);}
function qoMetal(){var m=(document.querySelector('input[name=qo_m]:checked')||{}).value;var u=document.getElementById('qo_usta');
 if(u){var cur=u.value;u.innerHTML='<option value="">Choose…</option>'+qoUstas(m).map(function(x){return '<option'+(x.name===cur?' selected':'')+'>'+esc(x.name)+'</option>';}).join('');}
 var s=document.getElementById('qo_sku');if(s){s.placeholder='Search '+m.toLowerCase()+' SKU or name';QO.pick=null;qoSku();}}
function qoFind(){var m=(document.querySelector('input[name=qo_m]:checked')||{}).value;if(QO.pick){var p=D.products.find(function(x){return x.metal===m&&x.id===QO.pick;});if(p)return p;}var s=fv('qo_sku').toUpperCase();return s?D.products.find(function(p){return p.metal===m&&p.sku.toUpperCase()===s;}):null;}
function qoSku(){var r=document.getElementById('qo_res'), sel=document.getElementById('qo_sel'), inp=document.getElementById('qo_sku');if(!r)return;
 var m=(document.querySelector('input[name=qo_m]:checked')||{}).value;
 if(!m){r.innerHTML='<div class="muted" style="padding:10px 4px">Choose the metal first</div>';return;}
 var q=fv('qo_sku').toLowerCase();if(QO.pick){var cp=D.products.find(function(x){return x.id===QO.pick;});if(!cp||cp.sku.toLowerCase()!==q)QO.pick=null;}
 if(QO.pick){r.innerHTML='';return;}sel.innerHTML='';inp.style.display='';
 var list=D.products.filter(function(p){return p.metal===m&&(!q||(p.sku+' '+p.name).toLowerCase().indexOf(q)>=0);});
 list.sort(function(a,b){var x=a.sku.toLowerCase().indexOf(q)===0?0:1,y=b.sku.toLowerCase().indexOf(q)===0?0:1;return x-y||a.sku.localeCompare(b.sku);});
 var n=list.length;list=list.slice(0,40);
 r.innerHTML=list.length?list.map(function(p){return '<button type="button" class="qo-item" onclick="qoPick(\''+esc(p.id)+'\')">'+thumb(p.img,p.metal,p.sku,52)+'<span class="qo-it"><b>'+esc(p.sku)+'</b><span>'+esc(p.name)+'</span></span><span class="muted" style="white-space:nowrap">'+(p.gram?num(p.gram,2)+' g':'')+'</span></button>';}).join('')+(n>40?'<div class="muted" style="padding:8px 4px">'+(n-40)+' more · type to narrow down</div>':''):'<div class="muted" style="padding:10px 4px">No '+m.toLowerCase()+' product matches</div>';
 fillImgs();}

 document.getElementById('qo_res').innerHTML='';
 document.getElementById('qo_sel').innerHTML='<div class="qo-pickd">'+thumb(p.img,p.metal,p.sku,84)+'<div style="flex:1;min-width:0"><b style="font-size:16px">'+esc(p.sku)+'</b><div class="muted">'+esc(p.name)+'</div><div class="muted">'+esc([p.gram?num(p.gram,2)+' g/pc':'',p.stones,p.color].filter(Boolean).join(' · '))+'</div></div><button type="button" class="btn ghost sm" onclick="qoUnpick()">Change</button></div>';}

 var st='background:'+(done?'#E2B53E':cur?'#14161C':'#fff')+';color:'+(done?'#14161C':cur?'#E2B53E':'#9AA0AE')+';border:'+(done||cur?'0':'1px solid #E1E3EA');
 var svg='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+s.d+'"/></svg>';
 var qcx=(k===5&&l&&!silver)?qcStep(l,n):'';return (can?'<button class="step stepb" title="'+tip+'" aria-label="'+esc(l.sku)+': '+tip+'" style="'+st+'" onclick="'+act+'">'+svg+'</button>':'<span class="step" title="'+tip+'" style="'+st+';opacity:.55">'+svg+'</span>')+qcx;}).join('')+'</div>';}

var QCI='M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M8.5 13.5l2.5 2.5 4.5-5';
function qcProd(l){return l.metal!=='Silver'?D.products.find(function(p){return p.metal!=='Silver'&&l.sku&&p.sku.toUpperCase()===String(l.sku).toUpperCase();}):null;}
function qcCat(l){var p=qcProd(l), t=((p&&p.cat)||'')+' '+(l.name||'')+' '+(l.notes||'')+' '+(l.sku||'');
 if(/earring|hoop|stud|jacket|küpe/i.test(t))return 'Earrings';if(/\bring\b|yüzük|^R\d/i.test(t)||/^R\d|^YZK/i.test(l.sku||''))return 'Ring';

function qcColor(l){var p=qcProd(l), c=(l.goldColor||l.color||(p&&p.color)||'').trim();if(!c)return 'Not specified · ask';c=c.toLowerCase();return /white/.test(c)?'White gold':/rose|pink/.test(c)?'Rose gold':/yellow|sar/.test(c)?'Yellow gold':c;}
function qcItems(l){var p=qcProd(l)||{}, sp=p.spec||{}, cat=specCat(p.cat)||qcCat(l), nt=l.notes||'', it=[];

 var motif=sp.motifSize||p.size||p.style||((String(l.name||'').match(/\d+(?:[.,]\d+)?\s?(?:cm|mm)|\b(?:extra large|large|medium|small|mini|big|thin|thick)\b/i)||[])[0])||'As in photo';

 var A=function(k,lab,exp,inp){it.push({k:k,label:lab,expected:exp||'',input:inp||''});};

 if(sp.custom)A('pcustom','Product customization done',sp.custom.slice(0,120));
 if(nt&&!/^Taşlı \(/.test(nt))A('custom','Personalization / special note done',nt.split('\n')[0].slice(0,80));

/* ---------- finance entries ---------- */
function openFin(type){var d=new Date().toISOString().slice(0,10);
 var h=mhead({'Cash In':'Add cash','Purchase':'Add purchase','Payment':'Add payment','Adjustment':'Add adjustment'}[type]||'Add supplier activity',{'Purchase':'Goods or work received from a supplier (adds to what we owe)','Payment':'Money, silver or gold paid to a supplier (reduces what we owe)','Adjustment':'Corrects a supplier balance up or down','Cash In':'Money coming into the cash box'}[type]||'Writes to Usta Hareketleri; balances update in the background');
 h+='<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">'
  +'<label class="fld" style="display:none">Type<select class="inp" id="fn_t" onchange="finShow()">'+['Purchase','Payment','Cash In','Opening Balance','Adjustment'].map(function(x){return '<option'+(x===type?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'
  +'<label class="fld">Date<input class="inp" type="date" id="fn_d" value="'+d+'"></label>'
  +'<label class="fld fn-u">Supplier<select class="inp" id="fn_u" onchange="finCalc()"><option value="">—</option>'+(D.ustas||[]).map(function(u){return '<option>'+esc(u.name)+'</option>';}).join('')+'</select></label>'
  +'<label class="fld" style="grid-column:1/-1">Description<input class="inp" id="fn_a"></label>'
  +'<label class="fld fn-pay">Payment method<select class="inp" id="fn_pm" onchange="finShow()"><option value="">—</option>'+['Labor in $','Silver in $','Fine gold in $','Silver (grams)','Fine gold (grams)','Other in $'].map(function(x){return '<option>'+x+'</option>';}).join('')+'</select></label>'
  +'<label class="fld fn-amt">Pay amount $<input class="inp" type="number" step="0.01" id="fn_pa" oninput="finCalc()"></label>'
  +'<label class="fld fn-split" style="justify-content:flex-end"><span class="seg"><label><input type="checkbox" id="fn_sp" onchange="finCalc()">Split in half (labor + silver)</label></span></label>'
  +'<label class="fld fn-gp">Gram price used $<input class="inp" type="number" step="0.001" id="fn_gp" oninput="finCalc()"></label>'
  +'<label class="fld fn-g">Silver product grams<input class="inp" type="number" step="0.01" id="fn_ug" oninput="finCalc()"></label>'
  +'<label class="fld fn-ag">Gold product grams<input class="inp" type="number" step="0.01" id="fn_ag" oninput="finCalc()"></label>'
  +'<label class="fld fn-lab">Labor $<input class="inp" type="number" step="0.01" id="fn_l"></label>'
  +'<label class="fld fn-sg">Silver g<input class="inp" type="number" step="0.01" id="fn_s"></label>'
  +'<label class="fld fn-has">Fine gold g<input class="inp" type="number" step="0.001" id="fn_h"></label>'
  +'<label class="fld fn-oth"><span id="fn_o_l">Other $</span><input class="inp" type="number" step="0.01" id="fn_o"></label>'
  +'<label class="fld fn-pesin" style="justify-content:flex-end"><span class="seg"><label><input type="checkbox" id="fn_p">Paid now (cash)</label></span></label>'
  +'<label class="fld" style="grid-column:span 2">Note<input class="inp" id="fn_n"></label>'
  +'<label class="fld">Photo<input class="inp" style="padding-top:8px" type="file" id="fn_ph" accept="image/*,application/pdf"></label></div>'
  +'<p class="muted" style="margin-top:10px">Grams and labor fill in from the supplier rates; you can change them before saving.</p>';
 h+='<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="fn_save" onclick="saveFin()">Save</button></div>';
 modal(h);finShow();}
function finShow(){var t=fv('fn_t'), pm=fv('fn_pm'), show=function(cls,on){[].forEach.call(document.querySelectorAll('.'+cls),function(e){e.style.display=on?'':'none';});};
 var cash=t==='Cash In', pay=t==='Payment', pur=t==='Purchase', free=!cash&&!pay&&!pur;
 show('fn-u',!cash);show('fn-pay',pay);show('fn-amt',pay&&/in \$/.test(pm));show('fn-gp',pay&&(pm==='Silver in $'||pm==='Fine gold in $'));show('fn-split',pay&&pm==='Silver in $');
 show('fn-g',pur||free||(pay&&pm==='Silver (grams)'));show('fn-ag',pur||free||(pay&&(pm==='Fine gold (grams)'||pm==='Fine gold in $')));
 show('fn-lab',pur||free||(pay&&(pm==='Labor in $'||pm==='Silver in $')));show('fn-sg',pur||free||(pay&&/Silver/.test(pm)));show('fn-has',pur||free||(pay&&/Fine gold/.test(pm)));
 show('fn-oth',cash||pur||free||(pay&&(pm==='Other in $'||!pm)));show('fn-pesin',pur);
 var ol=document.getElementById('fn_o_l');if(ol)ol.textContent=cash?'Amount $':'Other $';
 var gp=document.getElementById('fn_gp');if(gp&&!gp.value){if(pm==='Silver in $')gp.value=D.finance.silverPrice||D.prices.silver;if(pm==='Fine gold in $')gp.value=D.finance.goldPrice||'';}
 finCalc();}
function finCalc(){var t=fv('fn_t'), pm=fv('fn_pm'), u=(D.ustas||[]).find(function(x){return x.name===fv('fn_u');})||{}, r2=function(x){return Math.round(x*100)/100;}, set=function(id,val){var e=document.getElementById(id);if(e)e.value=(val===''||isNaN(val))?'':val;};
 var ug=Number(fv('fn_ug')||0), ag=Number(fv('fn_ag')||0), pa=Number(fv('fn_pa')||0), gp=Number(fv('fn_gp')||0), gk=u.gK||(u.name==='Erhan'?0.95:0.925), gl=u.gLab||0, hk=u.name==='Halil'?0.735:0.685;
 if(t==='Purchase'){set('fn_l',ug?r2(ug*gl):'');set('fn_s',ug?r2(ug*gk):'');set('fn_h',ag?Math.round(ag*hk*1000)/1000:'');}
 if(t==='Payment'){
  if(pm==='Labor in $')set('fn_l',pa||'');
  if(pm==='Other in $')set('fn_o',pa||'');
  if(pm==='Silver in $'){var sp=document.getElementById('fn_sp').checked;set('fn_l',pa&&sp?r2(pa/2):'');set('fn_s',pa&&gp?r2((sp?pa/2:pa)/gp):'');}
  if(pm==='Fine gold in $'){var has=pa&&gp?pa/gp:0;set('fn_h',has?Math.round(has*1000)/1000:'');set('fn_ag',has?r2(has/hk):'');}
  if(pm==='Silver (grams)')set('fn_s',ug?r2(ug*gk):'');
  if(pm==='Fine gold (grams)')set('fn_h',ag?Math.round(ag*hk*1000)/1000:'');}}
function saveFin(){var t=fv('fn_t');if(t!=='Cash In'&&!fv('fn_u')){toast('Choose the supplier');return;}if(t==='Payment'&&!fv('fn_pm')){toast('Choose the payment method');return;}
 var vis=function(id){var e=document.getElementById(id);return e&&e.closest('label').style.display!=='none'?fv(id):'';};
 busyBtn('fn_save','Saving…');
 readFile(document.getElementById('fn_ph')).then(function(photo){return post({op:'finAdd',photo:photo,fields:{islem:t,tarih:fv('fn_d'),usta:t==='Cash In'?'':fv('fn_u'),aciklama:fv('fn_a'),method:t==='Payment'?fv('fn_pm'):'',payAmount:vis('fn_pa'),gramPrice:vis('fn_gp'),urunGram:vis('fn_ug'),altinUrunGram:vis('fn_ag'),iscilik:vis('fn_l'),gumus:vis('fn_s'),has:vis('fn_h'),diger:vis('fn_o'),pesin:t==='Purchase'&&document.getElementById('fn_p').checked,not:fv('fn_n')}});})
 .then(function(r){closeModal();toast(t+' saved'+(r.rows>1?' with payment':'')+' · balances refresh in about a minute');load();})
 .catch(function(e){var b=document.getElementById('fn_save');if(b){b.disabled=false;b.style.opacity=1;b.textContent='Save';}toast('Not saved: '+(e.message||e));});}

 var fld=function(lbl,id,val,step,cls){return '<label class="fld'+(cls?' '+cls:'')+'">'+lbl+'<input class="inp" type="number" step="'+(step||'0.01')+'" id="'+id+'" value="'+esc(v(val))+'"></label>';};

 h+='<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">'

 h+='<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="openMove('+i+')">Cancel</button><button class="btn gold" id="me_save" onclick="saveMoveEdit('+i+')">Save changes</button></div>';

/* ---------- image zoom ---------- */
function bigImg(u){u=String(u||'');return u.replace(/=s\d+(-c)?$/,'=s1600').replace(/([?&])width=\d+&?/,'$1').replace(/[?&]$/,'');}
function zoomImg(src){closeZoom();var d=document.createElement('div');d.className='lb';d.id='lb';d.setAttribute('role','dialog');d.setAttribute('aria-label','Image preview');
 var im=document.createElement('img');im.src=bigImg(src);im.alt='';im.onerror=function(){if(im.src!==src)im.src=src;};
 var x=document.createElement('button');x.className='x';x.setAttribute('aria-label','Close');x.textContent='\u00d7';
 d.appendChild(im);d.appendChild(x);d.onclick=closeZoom;document.body.appendChild(d);}
function closeZoom(){var d=document.getElementById('lb');if(d)d.remove();}
document.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.hasAttribute('data-zoom')){e.preventDefault();e.stopPropagation();zoomImg(t.currentSrc||t.src);}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeZoom();});
